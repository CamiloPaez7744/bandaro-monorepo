services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bandaro
      POSTGRES_USER: bandaro
      POSTGRES_PASSWORD: bandaro_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandaro -d bandaro"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
